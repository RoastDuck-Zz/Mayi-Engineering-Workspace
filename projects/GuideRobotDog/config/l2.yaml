# Current L2 Ethernet target and evidence. Declarative only: no script loads it
# to write device, network, mode, firmware, or timestamp settings.
lidar:
  transport_target: ethernet
  work_mode_target: 0
  work_mode_current: 0
  work_mode_verified: true
  frame_id: lidar_link
  acceptance_passed: false # Cloud source gaps remain classified; ROS2 is blocked

ethernet:
  lidar_ip: "192.168.1.62"
  host_ip: "192.168.1.2"
  lidar_port: 6101
  host_port: 6201
  transport_verified: true
  integrity_verified: false # CRC clean; Cloud continuity has source-side gaps
  requested_rcvbuf_bytes: 4194304
  actual_rcvbuf_bytes: 425984 # Pi getsockopt; rmem_max was 212992
  so_rxq_ovfl_supported: true
  so_rxq_ovfl_delta: null # no ancillary counter was delivered in the run

serial:
  deployment_active: false
  status: FAILED
  historical_device: "/dev/unitree_l2"
  historical_baudrate: 4000000
  evidence: "docs/PHASE_B3_REPORT.md"
  descriptor_close_no_data: PASS_HISTORICAL
  streaming_clean_shutdown: PASS_HISTORICAL

timestamp:
  raw_clock_scale_observed: approximately_0.5
  correction_enabled: false
  candidate_scale_num: 2
  candidate_scale_den: 1
  evidence_verified: true # Ethernet 60s Cloud/IMU ratios are both ~0.499

official_sdk:
  repository: "https://github.com/unitreerobotics/unilidar_sdk2"
  tag: "v2.0.10"
  commit: "0e3c51f512e6b8ff60b8c32f160b412cb48445c2"
  runtime_verified: true
  initialize_udp: PASS
  run_parse: PASS
  cleanup: FAIL_KNOWN_ARM64_CLOSEUDP
  raw_packet_comparison: PASS

runtime:
  preferred_receiver: official_unitree_sdk
  diagnostic_receiver: passive_native

timestamp_policy:
  reference_model: markgol_l2lidar_node
  reference_commit: "e9931d5d9e9239829737b18c2485d23f155bc7cb"
  scale_num: 2
  scale_den: 1
  correction_model: anchored_elapsed_scaling
  host_sync_separate: true

ros:
  integrated: false
  jazzy_available: false
  blocker: "ROS2 Jazzy is not installed on the Pi; Ethernet Cloud gaps also require classification"
  pointcloud_topic: "/lidar/points"
  imu_topic: "/lidar/imu"

mount:
  evidence: "User-confirmed inverted installation; docs/L2_MOUNT_VALIDATION.md"
  verified_axis_mapping:
    lidar_z: negative_base_z
  mounting_fact: "+Z_lidar -> -Z_base"
  native_x_direction_verified: false
  native_y_direction_verified: false
  rotation_verified: false
  decoder_coordinates: sensor-native
  parent_frame: base_link
  child_frame: lidar_link
  translation_verified: false
  publish_tf: false
